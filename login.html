<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Открой Оренбуржье</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">Открой <span>Оренбуржье</span></div>
      <nav class="header-nav">
        <a href="catalog.html">Каталог</a>
        <a href="register.html">Регистрация</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <form class="form-card" id="login-form" action="profile.html" method="get">
      <h2>Вход в личный кабинет</h2>

      <div class="field">
        <label for="login-email">E-mail</label>
        <input id="login-email" name="email" type="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="login-password">Пароль</label>
        <input id="login-password" name="password" type="password" placeholder="••••••••" minlength="8" required>
      </div>

      <p class="login-valid">✓ Данные заполнены корректно — можно входить.</p>
      <p class="login-error">✗ Проверьте корректность введённых данных.</p>

      <button type="submit" id="login-submit" class="btn btn-primary btn-block">Войти</button>

      <p style="margin-top:14px;text-align:center;font-size:14px;">
        <a id="forgot-password-link" href="register.html">Забыли пароль?</a>
      </p>
      <p style="text-align:center;font-size:14px;">
        Нет аккаунта? <a href="register.html">Зарегистрируйтесь</a>
      </p>
    </form>
  </main>
</body>
</html>
